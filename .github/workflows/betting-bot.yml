name: Sports Betting Paper Bot

on:
  schedule:
    - cron: "0 */6 * * *"   # Her 6 saatte bir (günde 4 kez)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Botu çalıştır
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python betting_bot.py

      - name: Durumu commit et
        run: |
          git config user.name "betting-bot"
          git config user.email "betting-bot@users.noreply.github.com"
          git add state.json bets_log.csv
          git diff --quiet --cached || git commit -m "Bot güncellemesi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
